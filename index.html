<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- %BASE_URL% keeps these correct under any deploy prefix (GitHub Pages
         serves the app from /Bora.py/, not from the domain root). -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#ec3013" />
    <!-- Standalone display on a home-screen launch. The standard tag is what
         Chrome reads (it deprecated the apple- one and logs a console notice
         when it is alone); the apple- tag stays for older iOS, which only
         reads that. Both, on purpose. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="bora.py" />
    <meta
      name="description"
      content="Learn the Pareto slice of Python — you write and run the code, the app keeps the checkpoints."
    />
    <title>bora.py</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
